<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления производственным комплексом</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 24px;
            max-width: 960px;
            margin: auto;
            line-height: 1.5;
        }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: #f1f5f9; }
        h3 { font-size: 16px; font-weight: 600; margin: 24px 0 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

        .controls { display: flex; gap: 12px; margin-bottom: 24px; }
        button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease;
        }
        button:hover { background: #1d4ed8; }
        #autoBtn { background: #334155; }
        #autoBtn:hover { background: #475569; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card {
            background: #1e293b;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .card-value { font-size: 24px; font-weight: 700; color: #f8fafc; margin: 0; }

        .machines { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .machine-card {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            position: relative;
        }
        .machine-card.busy { border-left: 4px solid #f59e0b; }
        .machine-card.free { border-left: 4px solid #10b981; }
        .machine-name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
        .machine-status { font-size: 13px; color: #cbd5e1; }

        .logs {
            background: #020617;
            padding: 16px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            height: 240px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
        .log-line { margin-bottom: 6px; font-size: 13px; color: #38bdf8; }
    </style>
</head>
<body>

    <h2>Система мониторинга и диспетчеризации производственной линии</h2>

    <div class="controls">
        <button onclick="sendPart()">+ Подать партию компонентов</button>
        <button onclick="toggleAuto()" id="autoBtn">Запустить автоматическую подачу</button>
    </div>

    <div class="stats">
        <div class="card">
            <div class="card-label">Общая выручка</div>
            <div class="card-value" id="balance">0 ₽</div>
        </div>
        <div class="card">
            <div class="card-label">Буферный склад</div>
            <div class="card-value" id="warehouse">0 / 10</div>
        </div>
        <div class="card">
            <div class="card-label">Готовые узлы</div>
            <div class="card-value" id="readyParts">0</div>
        </div>
        <div class="card">
            <div class="card-label">Реализовано единиц</div>
            <div class="card-value" id="robotsSold">0</div>
        </div>
    </div>

    <h3>Статус производственных постов</h3>
    <div class="machines" id="machines"></div>

    <h3>Журнал событий комплекса</h3>
    <div class="logs" id="logs"></div>

    <script>
        const parts = [
            "Композитный лист",
            "Микроконтроллерный блок",
            "Сервопривод манипулятора",
            "Оптический сенсор",
            "Титан-алюминиевая пластина"
        ];
        let autoInterval = null;

        async function sendPart() {
            const randomPart = parts[Math.floor(Math.random() * parts.length)];
            await fetch('/api/supply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ part_name: randomPart })
            });
            fetchState();
        }

        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                btn.innerText = "Запустить автоматическую подачу";
                btn.style.background = "#334155";
            } else {
                autoInterval = setInterval(sendPart, 800);
                btn.innerText = "Приостановить конвейер";
                btn.style.background = "#b91c1c";
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();

                document.getElementById('balance').innerText = data.balance.toLocaleString() + " ₽";
                document.getElementById('warehouse').innerText = data.warehouse_count + " / " + data.warehouse_limit;
                document.getElementById('readyParts').innerText = data.ready_parts;
                document.getElementById('robotsSold').innerText = data.robots_sold;

                const mDiv = document.getElementById('machines');
                mDiv.innerHTML = data.machines.map(m => `
                    <div class="machine-card ${m.part ? 'busy' : 'free'}">
                        <div class="machine-name">${m.name}</div>
                        <div class="machine-status">
                            ${m.part
                                ? `В обработке: <strong>«${m.part}»</strong> (осталось ${m.time_left} с)`
                                : '<span style="color: #10b981;">Линия свободна</span>'}
                        </div>
                    </div>
                `).join('');

                const lDiv = document.getElementById('logs');
                lDiv.innerHTML = data.logs.map(l => `<div class="log-line">${l}</div>`).join('');
            } catch (e) {
                console.error("Ошибка обновления состояния:", e);
            }
        }

        setInterval(fetchState, 400);
        fetchState();
    </script>
</body>
</html>
